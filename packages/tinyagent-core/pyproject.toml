[project]
name = "tinyagent-core"
version = "0.1.0"
description = "A teaching-grade, extensible agent framework (import as tinyagent)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyagent"]
