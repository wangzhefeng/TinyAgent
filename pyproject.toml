[project]
name = "tinyagent"
version = "0.1.0"
description = "TinyAgent: AI agent learning lab - from-scratch implementations, a teaching-grade agent framework, and an experiment copilot"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.9",
    "langchain-core>=0.3.59",
    "langchain-openai",
    "langgraph>=0.4.2",
    "langsmith[pytest]>=0.3.4",
    "pandas",
    "matplotlib",
    "pytest",
    "pytest-xdist",
    "jupyter",
    "langgraph-cli[inmem]",
    "google-api-python-client>=2.128.0",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv",
    "pyppeteer",
    "html2text",
    "rich",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[tool.uv]
# 学习仓库根不作为安装包；可安装的包在 packages/ 下（workspace 成员）
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"learn/*" = ["D", "UP", "T201", "E402"]
"apps/*" = ["D", "UP", "T201", "E402"]
"hello_agents/*" = ["D", "UP", "T201", "E402"]
"scripts/*" = ["T201"]
"packages/*/examples/*" = ["D", "UP", "T201", "E402", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
