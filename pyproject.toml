[project]
name = "tinyagent"
description = "A self-hosted personal agent with safe workspace tools, durable sessions, memory, reviewed skills, and scheduled automation."
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.11"
keywords = ["agent", "llm", "personal-assistant", "cli", "mcp", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.0",
    "python-dotenv",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
socks = ["httpx[socks]"]

[dependency-groups]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
    "pytest",
    "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tinyagent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyagent"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
lint.select = [
    "E", "F", "I", "D", "D401", "T201", "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"examples/*" = ["D", "T201"]
"scripts/*" = ["T201"]
"evals/*" = ["D", "T201"]
"src/tinyagent/channels/cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
